<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 830" width="1120" height="830" role="img" aria-labelledby="title-7 desc-7">
<title id="title-7">Evidencia disponible y siguiente etapa</title><desc id="desc-7">Distingue implementación comprobada de pendientes, sin fechas de piloto institucional prometidas.</desc>
<defs><marker id="arrow-7" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#38bdf8"/></marker></defs>
<rect width="100%" height="100%" rx="12" fill="#0a0f17"/>
<rect x="30" y="60" width="325" height="165" rx="10" fill="#141d28" stroke="#38bdf8" stroke-width="1.5"/><rect x="30" y="72" width="4" height="141" rx="2" fill="#38bdf8"/><text x="48" y="85" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Implementación publicada</text><text x="48" y="112" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Reglas + dos funciones LLM</text><text x="48" y="130" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Demo de ficción y tandas</text><text x="48" y="148" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Revisión fundada y dos roles</text><text x="48" y="166" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Postgres y migraciones</text><rect x="395" y="60" width="325" height="165" rx="10" fill="#141d28" stroke="#4ade80" stroke-width="1.5"/><rect x="395" y="72" width="4" height="141" rx="2" fill="#4ade80"/><text x="413" y="85" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Evidencia registrada</text><text x="413" y="112" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">261 pruebas en último despliegue</text><text x="413" y="130" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Ruff sin hallazgos</text><text x="413" y="148" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Once casos sintéticos</text><text x="413" y="166" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Nueve decisiones + dos estados</text><rect x="760" y="60" width="325" height="165" rx="10" fill="#141d28" stroke="#c4b5fd" stroke-width="1.5"/><rect x="760" y="72" width="4" height="141" rx="2" fill="#c4b5fd"/><text x="778" y="85" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Comparación final v2 / v3</text><text x="778" y="112" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Decisiones: 9/9 en ambas</text><text x="778" y="130" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Citas: 25/29 a 22/22</text><text x="778" y="148" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Sin reintento: 5/9 a 9/9</text><text x="778" y="166" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Costo estimado: -25,3%</text><rect x="30" y="310" width="1055" height="110" rx="10" fill="#141d28" stroke="#fbbf24" stroke-width="1.5"/><rect x="30" y="322" width="4" height="86" rx="2" fill="#fbbf24"/><text x="48" y="335" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Qué demuestra esta evidencia</text><text x="48" y="362" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Viabilidad técnica sobre una muestra pequeña y conocida, con reglas deterministas y revisión humana.</text><text x="48" y="380" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">No demuestra ahorro de tiempo institucional, generalización estadística ni validación jurídica.</text><polyline points="192.5,225 557.5,310" fill="none" stroke="#38bdf8" stroke-width="1.7" /><polygon points="557.5,310 547.8273128988632,311.8544875959421 549.6417755826627,304.0629713655092" fill="#38bdf8"/><rect x="154.46000015735626" y="263" width="81.07999968528748" height="16" rx="3" fill="#0a0f17"/><text x="195" y="275" fill="#38bdf8" font-size="11" font-weight="400" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">implementado</text><polyline points="557.5,225 557.5,310" fill="none" stroke="#38bdf8" stroke-width="1.7" /><polygon points="557.5,310 553.5,301.0 561.5,301.0" fill="#38bdf8"/><rect x="525.1520001888275" y="263" width="59.69599962234497" height="16" rx="3" fill="#0a0f17"/><text x="555" y="275" fill="#38bdf8" font-size="11" font-weight="400" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">ejecutado</text><polyline points="922.5,225 557.5,310" fill="none" stroke="#38bdf8" stroke-width="1.7" /><polygon points="557.5,310 565.3582244173373,304.0629713655092 567.1726871011368,311.8544875959421" fill="#38bdf8"/><rect x="895.965500086546" y="263" width="48.06899982690811" height="16" rx="3" fill="#0a0f17"/><text x="920" y="275" fill="#38bdf8" font-size="11" font-weight="400" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">medido</text><rect x="30" y="510" width="500" height="170" rx="10" fill="#141d28" stroke="#fbbf24" stroke-width="1.5"/><rect x="30" y="522" width="4" height="146" rx="2" fill="#fbbf24"/><text x="48" y="535" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Pendientes de la entrega</text><text x="48" y="562" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Video real de demostración</text><text x="48" y="580" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Revisión visual en incógnito</text><text x="48" y="598" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Evidencia del límite en consola</text><text x="48" y="616" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Aceptación por el responsable</text><rect x="585" y="510" width="500" height="170" rx="10" fill="#141d28" stroke="#94a3b8" stroke-width="1.5"/><rect x="585" y="522" width="4" height="146" rx="2" fill="#94a3b8"/><text x="603" y="535" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Piloto institucional: propuesta</text><text x="603" y="562" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Validación jurídica y privacidad</text><text x="603" y="580" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Identidad individual y seguridad</text><text x="603" y="598" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Línea base y prueba con usuarios</text><text x="603" y="616" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Operación durable e integraciones</text><polyline points="555,420 555,460 280,460 280,510" fill="none" stroke="#fbbf24" stroke-width="1.7" stroke-dasharray="6 5"/><polygon points="280,510 276.0,501.0 284.0,501.0" fill="#fbbf24"/><polyline points="555,460 835,460 835,510" fill="none" stroke="#94a3b8" stroke-width="1.7" stroke-dasharray="6 5"/><polygon points="835,510 831.0,501.0 839.0,501.0" fill="#94a3b8"/><text x="30" y="750" fill="#a7b4c6" font-size="12" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Las ramas inferiores son condiciones por resolver, no funcionalidades presentes ni gates aprobados. No se asigna fecha al piloto institucional.</text><text x="30" y="790" fill="#a7b4c6" font-size="12" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">La mejora de urgencia de la iteración inicial corresponde al pipeline común; la comparación final de citas y reintentos diferencia prompts.</text></svg>