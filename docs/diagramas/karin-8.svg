<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1070" width="1120" height="1070" role="img" aria-labelledby="title-8 desc-8">
<title id="title-8">Revisión humana: responsabilidades y estados</title><desc id="desc-8">Flujo de firma inicial y validación, con fundamentos de descarte y excepción RD-10.</desc>
<defs><marker id="arrow-8" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#38bdf8"/></marker></defs>
<rect width="100%" height="100%" rx="12" fill="#0a0f17"/>
<rect x="380" y="35" width="360" height="100" rx="10" fill="#141d28" stroke="#4ade80" stroke-width="1.5"/><rect x="380" y="47" width="4" height="76" rx="2" fill="#4ade80"/><text x="398" y="60" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Pendiente de revisión humana</text><text x="398" y="87" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Propuesta o estado ya persistido</text><text x="398" y="105" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">No hay decisión final del agente</text><rect x="30" y="245" width="480" height="140" rx="10" fill="#141d28" stroke="#38bdf8" stroke-width="1.5"/><rect x="30" y="257" width="4" height="116" rx="2" fill="#38bdf8"/><text x="48" y="270" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Caso ordinario</text><text x="48" y="297" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Primera revisión según permisos</text><text x="48" y="315" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Inspector o supervisor</text><text x="48" y="333" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Comentario y decisión registrados</text><rect x="610" y="245" width="480" height="165" rx="10" fill="#141d28" stroke="#fbbf24" stroke-width="1.5"/><rect x="610" y="257" width="4" height="141" rx="2" fill="#fbbf24"/><text x="628" y="270" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Descarte o excepción RD-10</text><text x="628" y="297" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Primera revisión: inspector</text><text x="628" y="315" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Descarte: motivo + comentario + cita</text><text x="628" y="333" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Mediación con acoso sexual: advertencia</text><text x="628" y="351" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Excepción fundada; requiere supervisor</text><polyline points="560.0,135 560,185 270,185 270,245" fill="none" stroke="#38bdf8" stroke-width="1.7" /><polygon points="270,245 266.0,236.0 274.0,236.0" fill="#38bdf8"/><rect x="210.8095003068447" y="198" width="118.38099938631058" height="16" rx="3" fill="#0a0f17"/><text x="270" y="210" fill="#38bdf8" font-size="11" font-weight="400" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">sin condición protegida</text><polyline points="560,185 850,185 850,245" fill="none" stroke="#fbbf24" stroke-width="1.7" /><polygon points="850,245 846.0,236.0 854.0,236.0" fill="#fbbf24"/><rect x="799.3675002753735" y="198" width="101.26499944925308" height="16" rx="3" fill="#0a0f17"/><text x="850" y="210" fill="#fbbf24" font-size="11" font-weight="400" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">condición protegida</text><rect x="30" y="500" width="480" height="110" rx="10" fill="#141d28" stroke="#38bdf8" stroke-width="1.5"/><rect x="30" y="512" width="4" height="86" rx="2" fill="#38bdf8"/><text x="48" y="525" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Revisado · segunda firma disponible</text><text x="48" y="552" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">No implica cierre del caso</text><text x="48" y="570" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">La segunda firma es opcional en esta rama</text><rect x="610" y="500" width="480" height="110" rx="10" fill="#141d28" stroke="#fbbf24" stroke-width="1.5"/><rect x="610" y="512" width="4" height="86" rx="2" fill="#fbbf24"/><text x="628" y="525" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Pendiente de validación por supervisor</text><text x="628" y="552" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Nivel 1 registrado</text><text x="628" y="570" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">La segunda firma es obligatoria</text><polyline points="270.0,385 270.0,500" fill="none" stroke="#38bdf8" stroke-width="1.7" /><polygon points="270.0,500 266.0,491.0 274.0,491.0" fill="#38bdf8"/><polyline points="850.0,410 850.0,500" fill="none" stroke="#fbbf24" stroke-width="1.7" /><polygon points="850.0,500 846.0,491.0 854.0,491.0" fill="#fbbf24"/><rect x="335" y="720" width="450" height="130" rx="10" fill="#141d28" stroke="#4ade80" stroke-width="1.5"/><rect x="335" y="732" width="4" height="106" rx="2" fill="#4ade80"/><text x="353" y="745" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Validación de nivel 2</text><text x="353" y="772" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Supervisor distinto de quien firmó nivel 1</text><text x="353" y="790" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Control de versión: rechaza conflicto 409</text><text x="353" y="808" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Mismos fundamentos si descarta o exceptúa</text><polyline points="270.0,610 270,660 560,660 560,720" fill="none" stroke="#38bdf8" stroke-width="1.7" stroke-dasharray="6 5"/><polygon points="560,720 556.0,711.0 564.0,711.0" fill="#38bdf8"/><rect x="244.35500007867813" y="638" width="71.28999984264374" height="16" rx="3" fill="#0a0f17"/><text x="280" y="650" fill="#38bdf8" font-size="11" font-weight="400" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">si se solicita</text><polyline points="850.0,610 850,660 560,660" fill="none" stroke="#fbbf24" stroke-width="1.7" /><rect x="335" y="920" width="450" height="85" rx="10" fill="#141d28" stroke="#4ade80" stroke-width="1.5"/><rect x="335" y="932" width="4" height="61" rx="2" fill="#4ade80"/><text x="353" y="945" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Validación humana completada</text><text x="353" y="972" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Máximo dos firmas; no notifica ni cierra</text><polyline points="560.0,850 560.0,920" fill="none" stroke="#38bdf8" stroke-width="1.7" /><polygon points="560.0,920 556.0,911.0 564.0,911.0" fill="#38bdf8"/><text x="30" y="1045" fill="#a7b4c6" font-size="12" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Estos son estados de la interfaz. denuncia.estado pasa a EN_REVISION_HUMANA en la primera firma; no existe transición automática a CERRADO.</text></svg>