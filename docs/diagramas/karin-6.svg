<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" role="img" aria-labelledby="title-6 desc-6">
<title id="title-6">Flujo real de verificación y publicación</title><desc id="desc-6">Comandos y comprobaciones de la sesión, sin atribuir un CI automático inexistente.</desc>
<defs><marker id="arrow-6" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#38bdf8"/></marker></defs>
<rect width="100%" height="100%" rx="12" fill="#0a0f17"/>
<rect x="30" y="80" width="245" height="125" rx="10" fill="#141d28" stroke="#38bdf8" stroke-width="1.5"/><rect x="30" y="92" width="4" height="101" rx="2" fill="#38bdf8"/><text x="48" y="105" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">1 · Rama de trabajo</text><text x="48" y="132" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Cambios acotados</text><text x="48" y="150" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Revisión de diff</text><rect x="320" y="80" width="245" height="125" rx="10" fill="#141d28" stroke="#38bdf8" stroke-width="1.5"/><rect x="320" y="92" width="4" height="101" rx="2" fill="#38bdf8"/><text x="338" y="105" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">2 · Verificar</text><text x="338" y="132" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">pytest + Ruff</text><text x="338" y="150" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Evaluaciones si corresponde</text><rect x="610" y="80" width="245" height="125" rx="10" fill="#141d28" stroke="#38bdf8" stroke-width="1.5"/><rect x="610" y="92" width="4" height="101" rx="2" fill="#38bdf8"/><text x="628" y="105" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">3 · Revisar contenido</text><text x="628" y="132" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">git diff --cached</text><text x="628" y="150" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Sin secretos en commit</text><rect x="900" y="80" width="245" height="125" rx="10" fill="#141d28" stroke="#38bdf8" stroke-width="1.5"/><rect x="900" y="92" width="4" height="101" rx="2" fill="#38bdf8"/><text x="918" y="105" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">4 · Publicar GitHub</text><text x="918" y="132" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Push de rama</text><text x="918" y="150" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Integración autorizada</text><rect x="900" y="350" width="245" height="125" rx="10" fill="#141d28" stroke="#38bdf8" stroke-width="1.5"/><rect x="900" y="362" width="4" height="101" rx="2" fill="#38bdf8"/><text x="918" y="375" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">5 · Enviar a Heroku</text><text x="918" y="402" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">git push heroku</text><text x="918" y="420" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">HEAD:main</text><rect x="610" y="350" width="245" height="125" rx="10" fill="#141d28" stroke="#38bdf8" stroke-width="1.5"/><rect x="610" y="362" width="4" height="101" rx="2" fill="#38bdf8"/><text x="628" y="375" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">6 · Construir</text><text x="628" y="402" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Dockerfile</text><text x="628" y="420" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Dependencias bloqueadas</text><rect x="320" y="350" width="245" height="125" rx="10" fill="#141d28" stroke="#38bdf8" stroke-width="1.5"/><rect x="320" y="362" width="4" height="101" rx="2" fill="#38bdf8"/><text x="338" y="375" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">7 · Release</text><text x="338" y="402" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Alembic upgrade head</text><text x="338" y="420" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Debe terminar succeeded</text><rect x="30" y="350" width="245" height="125" rx="10" fill="#141d28" stroke="#4ade80" stroke-width="1.5"/><rect x="30" y="362" width="4" height="101" rx="2" fill="#4ade80"/><text x="48" y="375" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">8 · Comprobar</text><text x="48" y="402" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Salud HTTPS y login</text><text x="48" y="420" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Flujo y persistencia</text><polyline points="275,142.5 320,142.5" fill="none" stroke="#38bdf8" stroke-width="1.7" /><polygon points="320,142.5 311.0,146.5 311.0,138.5" fill="#38bdf8"/><polyline points="565,142.5 610,142.5" fill="none" stroke="#38bdf8" stroke-width="1.7" /><polygon points="610,142.5 601.0,146.5 601.0,138.5" fill="#38bdf8"/><polyline points="855,142.5 900,142.5" fill="none" stroke="#38bdf8" stroke-width="1.7" /><polygon points="900,142.5 891.0,146.5 891.0,138.5" fill="#38bdf8"/><polyline points="1022.5,205 1022.5,350" fill="none" stroke="#38bdf8" stroke-width="1.7" /><polygon points="1022.5,350 1018.5,341.0 1026.5,341.0" fill="#38bdf8"/><rect x="964.9490002989769" y="268" width="114.1019994020462" height="16" rx="3" fill="#0a0f17"/><text x="1022" y="280" fill="#38bdf8" font-size="11" font-weight="400" text-anchor="middle" font-family="Arial,Helvetica,sans-serif">despliegue solicitado</text><polyline points="900,412.5 855,412.5" fill="none" stroke="#38bdf8" stroke-width="1.7" /><polygon points="855,412.5 864.0,408.5 864.0,416.5" fill="#38bdf8"/><polyline points="610,412.5 565,412.5" fill="none" stroke="#38bdf8" stroke-width="1.7" /><polygon points="565,412.5 574.0,408.5 574.0,416.5" fill="#38bdf8"/><polyline points="320,412.5 275,412.5" fill="none" stroke="#38bdf8" stroke-width="1.7" /><polygon points="275,412.5 284.0,408.5 284.0,416.5" fill="#38bdf8"/><rect x="30" y="550" width="1115" height="95" rx="10" fill="#141d28" stroke="#fbbf24" stroke-width="1.5"/><rect x="30" y="562" width="4" height="71" rx="2" fill="#fbbf24"/><text x="48" y="575" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Alcance de esta vista</text><text x="48" y="602" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">No hay workflows de GitHub Actions versionados en el corte revisado. No se afirma CI con mypy, Trivy, RLS o UAT.</text><text x="48" y="620" fill="#cbd5e1" font-size="12.5" font-weight="400" text-anchor="start" font-family="Arial,Helvetica,sans-serif">Las evaluaciones reales consumen API y presupuesto; no se ejecutan automáticamente por cada visita.</text></svg>